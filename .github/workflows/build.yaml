name: Build, test, and generate reports

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solitaire-app
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 23
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
          cache-dependency-path: solitaire-app/pom.xml

      - name: Build, test, and generate reports
        # The wrapper need not have its executable bit set in Git.
        run: sh ./mvnw --batch-mode --no-transfer-progress clean test site

      - name: Verify both reports exist
        run: |
          test -s target/site/reports/apidocs/index.html
          test -s target/site/jacoco/index.html

      - name: Upload JavaDoc and JaCoCo reports
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: solitaire-reports
          if-no-files-found: error
          # Action paths are relative to the repository, not defaults.run.
          path: |
            solitaire-app/target/site/reports/apidocs/
            solitaire-app/target/site/jacoco/
